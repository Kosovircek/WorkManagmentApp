# GitHub Actions: ob vsakem pushu prevede aplikacijo in pripne APK kot artefakt.
# APK najdeš v zavihku Actions -> zadnji zagon -> Artifacts -> "SluzbaTaski-debug-apk".
name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prevedi debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SluzbaTaski-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
